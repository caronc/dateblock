# Builds and tests the PyPI source package and wheels on Linux, macOS and
# Windows.
#  - Every push and pull request: build and test only; nothing is kept
#    (no artifacts are saved).
#  - Pushing a version tag (ie: v2.0.0): once every build and test has
#    passed, the publish jobs build the files again and upload them straight
#    to PyPI using trusted publishing (no API token is stored; see
#    packaging/README.md).  This is the only time PyPI is touched, and
#    nothing is uploaded unless everything passed.
name: Wheels

on:
  push:
    branches: [master]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    name: Wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04-arm builds the aarch64 Linux wheels natively;
        # macos-latest builds both arm64 and x86_64 macOS wheels
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Build and test wheels
        uses: pypa/cibuildwheel@v4.3.4
        env:
          CIBW_ARCHS_MACOS: x86_64 arm64

  sdist:
    name: Source package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build source package
        run: pipx run build --sdist

      - name: Check the PyPI page will render
        run: pipx run twine check --strict dist/*

  # Version tags only, and only once every job above has passed
  publish:
    name: Publish (${{ matrix.os }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [wheels, sdist]
    runs-on: ${{ matrix.os }}
    # Lets this job prove to PyPI that it comes from this repository
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Build wheels (already tested above)
        uses: pypa/cibuildwheel@v4.3.4
        env:
          CIBW_ARCHS_MACOS: x86_64 arm64
          CIBW_TEST_SKIP: "*"

      - name: Build source package
        if: matrix.os == 'ubuntu-latest'
        run: pipx run build --sdist --outdir wheelhouse

      - name: Upload to PyPI
        shell: bash
        run: .github/workflows/pypi-upload.sh wheelhouse/*
