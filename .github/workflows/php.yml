# Builds the PHP extension and runs its tests, on every supported PHP
# version (Linux) and on macOS, and installs it with PIE from this checkout.
# Nothing is published or kept: PIE users get new versions from Packagist,
# which reads the version tags itself.
name: PHP

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# The action is pinned to an exact commit (a tag such as @v2 can be moved);
# Dependabot (.github/dependabot.yml) opens a pull request when it has a new
# release.
jobs:
  test:
    name: PHP ${{ matrix.php }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        php: ['8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
        include:
          - os: macos-latest
            php: '8.5'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962  # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          tools: phpize, php-config
          coverage: none

      - name: Build
        working-directory: php
        run: |
          phpize
          ./configure
          make

      - name: Test
        working-directory: php
        env:
          NO_INTERACTION: 1
          REPORT_EXIT_STATUS: 1
          TEST_PHP_ARGS: -q --show-diff
        run: make test

  # Installs the extension the way users get it: PIE reads composer.json,
  # builds php/ and turns the extension on.  It uses this checkout instead
  # of Packagist, so a broken composer.json shows up here before a version
  # tag is pushed.
  pie:
    name: PIE install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962  # 2.40.0
        with:
          php-version: '8.5'
          tools: composer, pie, phpize, php-config
          coverage: none

      - name: Check composer.json
        run: composer validate --strict

      # Installing into PHP's own folders needs root, and PIE can't ask for
      # sudo by itself without a terminal, so it is run with sudo (git has
      # to be told the checkout is safe to read as root)
      - name: Install with PIE
        run: |
          sudo git config --global --add safe.directory "$GITHUB_WORKSPACE"
          sudo "$(command -v pie)" repository:add path "$GITHUB_WORKSPACE"
          sudo "$(command -v pie)" install --no-interaction "caronc/dateblock:*@dev"

      - name: Check it is loaded
        run: |
          php -m | grep -x dateblock
          php -r 'echo dateblock("0 0 9", block: false)->format(DATE_ATOM), PHP_EOL;'
