# Builds and tests the npm packages: @caronc/dateblock itself, and the
# ready-built add-on for each platform in node/platforms.json (ie:
# @caronc/dateblock-linux-x64-gnu), which npm installs alongside it so
# users need no compiler.
#  - Every push and pull request: build and test only; nothing is kept
#    (no artifacts are saved).
#  - Pushing a version tag (ie: v2.1.0): once every test has passed, the
#    publish jobs build each package again and upload it straight to npm
#    using trusted publishing (no token is stored; see packaging/README.md).
#    The ready-built add-ons go first; @caronc/dateblock itself only once
#    all of them are on npm, so nobody can install it without them.
name: npm

on:
  push:
    branches: [master]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# The actions are pinned to exact commits (a tag such as @v7 can be moved);
# Dependabot (.github/dependabot.yml) opens a pull request when they have
# a new release.
jobs:
  # Built from the source (as 'npm run build' does) on each Node.js version
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: ${{ matrix.node }}

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  # The ready-built add-on for each platform, built and tested, then packed
  # and checked as users install it (see packaging/npm/build.sh).  Linux
  # builds run in a container (see docker-npm in GNUmakefile).
  prebuilt:
    name: Ready-built (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: linux-x64-gnu, os: ubuntu-latest, libc: gnu}
          - {platform: linux-arm64-gnu, os: ubuntu-24.04-arm, libc: gnu}
          - {platform: linux-x64-musl, os: ubuntu-latest, libc: musl}
          - {platform: linux-arm64-musl, os: ubuntu-24.04-arm, libc: musl}
          - {platform: darwin-arm64, os: macos-latest, arch: arm64}
          # The Intel build runs under Rosetta on Apple silicon
          - {platform: darwin-x64, os: macos-latest, arch: x64}
          - {platform: win32-x64, os: windows-latest, arch: x64}
          - {platform: win32-arm64, os: windows-11-arm, arch: arm64}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Build and check (in a container)
        if: matrix.libc
        run: make docker-npm NPM_LIBC=${{ matrix.libc }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '24'
          architecture: ${{ matrix.arch }}
          registry-url: https://registry.npmjs.org
          # Never restore a cache into a job that may publish
          package-manager-cache: false

      - name: Build and check
        if: '!matrix.libc'
        shell: bash
        run: packaging/npm/build.sh dist/npm-${{ matrix.platform }}

  # Version tags only, and only once every test above has passed
  publish-prebuilt:
    name: Publish (${{ matrix.platform }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, prebuilt]
    runs-on: ${{ matrix.os }}
    # Lets this job prove to npm that it comes from this repository
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      # The same as 'prebuilt' above
      matrix:
        include:
          - {platform: linux-x64-gnu, os: ubuntu-latest, libc: gnu}
          - {platform: linux-arm64-gnu, os: ubuntu-24.04-arm, libc: gnu}
          - {platform: linux-x64-musl, os: ubuntu-latest, libc: musl}
          - {platform: linux-arm64-musl, os: ubuntu-24.04-arm, libc: musl}
          - {platform: darwin-arm64, os: macos-latest, arch: arm64}
          - {platform: darwin-x64, os: macos-latest, arch: x64}
          - {platform: win32-x64, os: windows-latest, arch: x64}
          - {platform: win32-arm64, os: windows-11-arm, arch: arm64}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Build and check (in a container)
        if: matrix.libc
        run: make docker-npm NPM_LIBC=${{ matrix.libc }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '24'
          architecture: ${{ matrix.arch }}
          registry-url: https://registry.npmjs.org
          # Never restore a cache into a job that may publish
          package-manager-cache: false

      - name: Build and check
        if: '!matrix.libc'
        shell: bash
        run: packaging/npm/build.sh dist/npm-${{ matrix.platform }}
      - name: Publish
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          .github/workflows/npm-publish.sh \
             dist/npm-*/caronc-dateblock-${{ matrix.platform }}-"$version".tgz

  publish:
    name: Publish (@caronc/dateblock)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [publish-prebuilt]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Build and check
        run: make docker-npm

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Publish
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          .github/workflows/npm-publish.sh "dist/npm-gnu/caronc-dateblock-$version.tgz"
